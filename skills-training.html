<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Training Program - Sikh Aid Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Raleway:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="icon" type="image/png" href="https://sikhaidglobal.org/assets/images/favicon-32x32.png">

  <style>
    :root { --navy: #00365B; --orange: #F44708; --cream: #F7EDDB; --light: #F5F7FA; --gray: #6B7280; }
    .project-hero { background: linear-gradient(135deg, var(--navy) 0%, rgba(0,54,91,.8) 100%); color: #fff; padding: 100px 0 60px; text-align: center; }
    .project-hero h1 { font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 20px; }
    .section-pad { padding: 90px 0; }
    .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 40px 0; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer; aspect-ratio: 1; background: #f0f0f0; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease; }
    .gallery-container:hover .gallery-item img { opacity: 0.4; }
    .gallery-container .gallery-item:hover img { opacity: 1 !important; }
    .gallery-description { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); color: #fff; padding: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
    .gallery-item:hover .gallery-description { opacity: 1; }
    .gallery-item:nth-child(2) { grid-column: span 2; }
    .gallery-item:nth-child(4) { grid-column: span 2; }
    @media (max-width: 768px) { .gallery-container { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .gallery-item:nth-child(2), .gallery-item:nth-child(4) { grid-column: span 1; } }
  </style>
</head>
<body>
  <section class="project-hero">
    <div class="container-lg">
      <h1>Skills Training Program</h1>
      <p>Empowering communities through practical skills</p>
    </div>
  </section>

  <section class="section-pad bg-light-sag">
    <div class="container-lg">
      <div class="gallery-container" id="imageGallery"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    const galleryImages = [
      { src: 'https://sikhaidglobal.org/assets/images/skills-sewing-machine.jpg', description: 'Close-up of new sewing machine with Sarbat Da Bhala message' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-sewing-demonstration.jpg', description: 'Volunteer demonstrating sewing machine to women trainees' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-women-training.jpg', description: 'Women working together naturally on fabric in training' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-quality-check.jpg', description: 'Volunteer and trainee examining finished stitching work' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-digital-training.jpg', description: 'Volunteers at table with trainees working on digital skills' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-program-review.jpg', description: 'Structured program review with instructor and trainee' },
      { src: 'https://sikhaidglobal.org/assets/images/skills-classroom.jpg', description: 'Full classroom of trainees working at sewing tables' }
    ];
    function initGallery() {
      const gallery = document.getElementById('imageGallery');
      gallery.innerHTML = galleryImages.map((img, index) => `
        <div class="gallery-item" data-aos="fade-up" data-aos-delay="${index * 50}">
          <img src="${img.src}" alt="Skills Training" loading="lazy" />
          <div class="gallery-description">${img.description}</div>
        </div>
      `).join('');
      AOS.refresh();
    }
    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
  <script src="js/header-loader.js"></script>
  <script src="js/footer-loader.js"></script>
</body>
</html>
