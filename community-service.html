<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Service - Sikh Aid Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Raleway:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="icon" type="image/png" href="https://sikhaidglobal.org/assets/images/favicon-32x32.png">

  <style>
    .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 40px 0; width: 100%; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer; width: 100%; height: 280px; background: #f0f0f0; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease; display: block; }
    .gallery-container:hover .gallery-item img { opacity: 0.4; }
    .gallery-container .gallery-item:hover img { opacity: 1 !important; }
    .gallery-description { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); color: #fff; padding: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
    .gallery-item:hover .gallery-description { opacity: 1; }
    .gallery-item:nth-child(2) { grid-column: span 2; height: auto; }
    .gallery-item:nth-child(4) { grid-column: span 2; height: auto; }
    .gallery-item:nth-child(6) { grid-column: span 2; height: auto; }
    @media (max-width: 768px) { .gallery-container { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .gallery-item:nth-child(2), .gallery-item:nth-child(4), .gallery-item:nth-child(6) { grid-column: span 1; height: 150px; } .gallery-item { height: 150px; } }
</style>
</head>
<body>
  <section class="project-hero">
    <div class="container-lg">
      <h1>Community Service</h1>
      <p>Supporting families and communities in need</p>
    </div>
  </section>

  <section class="section-pad bg-light-sag">
    <div class="container-lg">
      <div class="gallery-container" id="imageGallery"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    const galleryImages = [
      { src: 'https://sikhaidglobal.org/assets/images/welfare-family-home.jpg', description: 'Family of eight standing in front of their bamboo-walled home' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-volunteers-with-families.jpg', description: 'Volunteers in yellow delivering support directly to families' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-volunteers-with-villager.jpg', description: 'Volunteers taking a listening-first approach with villagers' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-volunteers-handing-aid.jpg', description: 'Clear human moment of volunteers handing aid to women' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-couple-old-home.jpg', description: 'Couple standing outside their old bamboo-and-thatch home' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-family-old-home.jpg', description: 'Same family with children outside their old home together' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-new-home-construction.jpg', description: 'Visible progress with brick walls and water tank being installed' },
      { src: 'https://sikhaidglobal.org/assets/images/welfare-community-gathering.jpg', description: 'Volunteers with families at community gathering showing scale' }
    ];
    function initGallery() {
      const gallery = document.getElementById('imageGallery');
      gallery.innerHTML = galleryImages.map((img, index) => `
        <div class="gallery-item" data-aos="fade-up" data-aos-delay="${index * 50}">
          <img src="${img.src}" alt="Community Service" />
          <div class="gallery-description">${img.description}</div>
        </div>
      `).join('');
      AOS.refresh();
    }
    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
  <script src="js/header-loader.js"></script>
  <script src="js/footer-loader.js"></script>
</body>
</html>
