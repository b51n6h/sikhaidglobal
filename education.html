<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Education Program - Sikh Aid Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Raleway:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="icon" type="image/png" href="https://sikhaidglobal.org/assets/images/favicon-32x32.png">

  <style>
    :root { --navy: #00365B; --orange: #F44708; --cream: #F7EDDB; --light: #F5F7FA; --gray: #6B7280; }
    .project-hero { background: linear-gradient(135deg, var(--navy) 0%, rgba(0,54,91,.8) 100%); color: #fff; padding: 100px 0 60px; text-align: center; }
    .project-hero h1 { font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 20px; }
    .section-pad { padding: 90px 0; }
    .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 40px 0; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer; aspect-ratio: 1; background: #f0f0f0; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease; }
    .gallery-container:hover .gallery-item img { opacity: 0.4; }
    .gallery-container .gallery-item:hover img { opacity: 1 !important; }
    .gallery-description { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); color: #fff; padding: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
    .gallery-item:hover .gallery-description { opacity: 1; }
    .gallery-item:nth-child(2) { grid-column: span 2; }
    .gallery-item:nth-child(4) { grid-column: span 2; }
    .gallery-item:nth-child(6) { grid-column: span 2; }
    @media (max-width: 768px) { .gallery-container { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .gallery-item:nth-child(2), .gallery-item:nth-child(4), .gallery-item:nth-child(6) { grid-column: span 1; } }
  </style>
</head>
<body>
  <section class="project-hero">
    <div class="container-lg">
      <h1>Education Program</h1>
      <p>Transforming lives through quality education</p>
    </div>
  </section>

  <section class="section-pad bg-light-sag">
    <div class="container-lg">
      <div class="gallery-container" id="imageGallery"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    const galleryImages = [
      { src: 'https://sikhaidglobal.org/assets/images/education-school-group.jpg', description: 'Uniformed pupils and volunteers proudly standing outside Future Flying School' },
      { src: 'https://sikhaidglobal.org/assets/images/education-students-uniforms.jpg', description: 'Two smiling students showcasing their school uniforms with dignity' },
      { src: 'https://sikhaidglobal.org/assets/images/education-students-waving.jpg', description: 'Joyful students waving with energy and enthusiasm' },
      { src: 'https://sikhaidglobal.org/assets/images/education-students-row.jpg', description: 'A row of uniformed students showing school pride' },
      { src: 'https://sikhaidglobal.org/assets/images/education-classroom.jpg', description: 'Children engaged in learning at their desks in a bright classroom' },
      { src: 'https://sikhaidglobal.org/assets/images/education-certificates.jpg', description: 'Students proudly holding achievement certificates with school banner' },
      { src: 'https://sikhaidglobal.org/assets/images/education-studying-floor.jpg', description: 'Real study session with children learning together' },
      { src: 'https://sikhaidglobal.org/assets/images/education-assembly.jpg', description: 'Whole-school assembly showing the scale and spirit of the program' },
      { src: 'https://sikhaidglobal.org/assets/images/education-panorama.jpg', description: 'Wide panoramic view of uniformed pupils with teachers' }
    ];
    function initGallery() {
      const gallery = document.getElementById('imageGallery');
      gallery.innerHTML = galleryImages.map((img, index) => `
        <div class="gallery-item" data-aos="fade-up" data-aos-delay="${index * 50}">
          <img src="${img.src}" alt="Education" loading="lazy" />
          <div class="gallery-description">${img.description}</div>
        </div>
      `).join('');
      AOS.refresh();
    }
    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
  <script src="js/header-loader.js"></script>
  <script src="js/footer-loader.js"></script>
</body>
</html>
